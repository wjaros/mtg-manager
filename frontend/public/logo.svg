<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1136" />
      <stop offset="100%" stop-color="#0d0718" />
    </radialGradient>

    <!-- Gold: the book and the cards' edges -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Purple glow: the cards and the die -->
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" fill="url(#bg-grad)" />

  <!-- A d20's outline behind -->
  <g stroke="#3b1d6e" stroke-width="6" fill="none" opacity="0.55" stroke-linejoin="round">
    <polygon points="256,36 446,146 446,366 256,476 66,366 66,146" />
    <line x1="256" y1="36" x2="256" y2="160" />
    <line x1="66" y1="146" x2="446" y2="146" />
    <line x1="66" y1="146" x2="160" y2="366" />
    <line x1="446" y1="146" x2="352" y2="366" />
    <line x1="66" y1="366" x2="256" y2="410" />
    <line x1="446" y1="366" x2="256" y2="410" />
    <line x1="256" y1="410" x2="256" y2="476" />
  </g>

  <!-- An open book: the cover -->
  <g stroke="url(#gold-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="#180b2c">
    <!-- The cover -->
    <path d="M 106,190 L 106,360 L 226,360 C 240,360 250,372 256,372 C 262,372 272,360 286,360 L 406,360 L 406,190" />
    <!-- The pages -->
    <path d="M 126,172 C 176,172 226,188 256,215 C 286,188 336,172 386,172 L 386,340 C 336,340 286,350 256,368 C 226,350 176,340 126,340 Z" fill="#271247" />
  </g>

  <!-- Cards coming out of the book -->
  <g stroke="url(#gold-grad)" stroke-width="6" stroke-linejoin="round">
    <!-- Left -->
    <rect x="155" y="160" width="76" height="106" rx="8" transform="rotate(-16 193 213)" fill="url(#purple-glow)" />
    <!-- Right -->
    <rect x="281" y="160" width="76" height="106" rx="8" transform="rotate(16 319 213)" fill="url(#purple-glow)" />
    <!-- Right, lower -->
    <rect x="305" y="195" width="72" height="100" rx="8" transform="rotate(30 341 245)" fill="#4c1d95" />
  </g>

  <!-- The d20 in the middle -->
  <g filter="url(#glow)">
    <polygon points="256,192 318,228 318,300 256,336 194,300 194,228" fill="#1e0b36" stroke="url(#purple-glow)" stroke-width="8" stroke-linejoin="round" />
    <g stroke="#d8b4fe" stroke-width="5" stroke-linejoin="round" fill="none">
      <polygon points="256,216 296,284 216,284" fill="#6b21a8" fill-opacity="0.5" />
      <line x1="256" y1="192" x2="256" y2="216" />
      <line x1="194" y1="228" x2="256" y2="216" />
      <line x1="318" y1="228" x2="256" y2="216" />
      <line x1="194" y1="228" x2="216" y2="284" />
      <line x1="318" y1="228" x2="296" y2="284" />
      <line x1="194" y1="300" x2="216" y2="284" />
      <line x1="318" y1="300" x2="296" y2="284" />
      <line x1="256" y1="336" x2="216" y2="284" />
      <line x1="256" y1="336" x2="296" y2="284" />
    </g>
  </g>

  <!-- A sparkle above the book -->
  <path d="M256,125 Q256,150 281,150 Q256,150 256,175 Q256,150 231,150 Q256,150 256,125 Z" fill="url(#gold-grad)" />
</svg>