name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of queueing behind it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does this run release? A push to master whose __version__ (backend/mtgdm/__init__.py) has no
  # GitHub Release yet, or a pushed v* tag (which must match __version__). The packages are built
  # for releases, pull requests and manual runs only: a merge without a new version runs the tests
  # and skips three package builds the PR already did.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/mtgdm/__init__.py)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $version (backend/mtgdm/__init__.py)"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag has no release yet: building and releasing it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests (${{ matrix.os }})
    # Tests are platform-independent: Linux runners are fast and cheap, Windows catches path and
    # encoding issues. macOS runners are reserved for building the macOS packages.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        working-directory: backend
        # Fail on file I/O without an explicit encoding in our code (see filterwarnings in pyproject).
        run: uv run python -X warn_default_encoding -m pytest -q

      - name: Python lint
        working-directory: backend
        run: uvx ruff check mtgdm tests ../scripts

      - name: Frontend build and lint
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run lint

  package:
    name: Package (${{ matrix.name }})
    needs: [version, test]
    if: github.event_name != 'push' || needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The minimal OpenCV build (scripts/build_opencv.py) takes minutes; reuse it while the
      # OpenCV version and the build script stay the same.
      - name: Cache minimal OpenCV
        uses: actions/cache@v4
        with:
          path: build/opencv-slim
          key: opencv-slim-${{ matrix.name }}-${{ hashFiles('backend/uv.lock', 'scripts/build_opencv.py') }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: scripts/build_macos.sh

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: uv run --no-project python scripts/smoke_test.py "dist/MTG Deck Manager.app/Contents/MacOS/mtgdm"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: uv run --no-project python scripts/smoke_test.py "dist/MTG Deck Manager/MTG Deck Manager.exe"

      # The package as it is (archive: false), named after its file: a zipped artifact would be a zip
      # holding the Windows zip.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.os == 'Windows' && 'dist/*.zip' || 'dist/*.dmg' }}
          archive: false
          if-no-files-found: error
          # Push builds are for checking; releases keep their files in GitHub Releases.
          retention-days: 14

  release:
    name: GitHub Release
    # After every package built and passed its smoke test (see the version job for when).
    needs: [version, package]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the commits since the previous release, for the notes

      # The packages were uploaded as they are; without skip-decompress a raw .zip (the Windows
      # package) is taken for a zipped artifact and unpacked into a folder.
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: MTG-Deck-Manager-*
          merge-multiple: true
          skip-decompress: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l release
          # Notes from the (squashed) commit messages since the previous release, not just PR titles.
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          python3 scripts/release_notes.py "$previous" "$TAG" "$GITHUB_REPOSITORY" > notes.md
          cat notes.md
          # On master the tag is created at this commit (a tag made with the workflow token does not
          # start another build).
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "MTG Deck Manager ${TAG#v}" \
            --notes-file notes.md
