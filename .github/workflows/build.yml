name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of queueing behind it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does this run release? A push to master whose __version__ (backend/mtgdm/__init__.py) has no
  # GitHub Release yet, or a pushed v* tag (which must match __version__). The packages are built
  # for releases, pull requests and manual runs only: a merge without a new version runs the tests
  # and skips three package builds the PR already did.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/mtgdm/__init__.py)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $version (backend/mtgdm/__init__.py)"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag has no release yet: building and releasing it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests (${{ matrix.os }})
    # Tests are platform-independent: Linux runners are fast and cheap, Windows catches path and
    # encoding issues. macOS runners are reserved for building the macOS packages.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        working-directory: backend
        # Fail on file I/O without an explicit encoding in our code (see filterwarnings in pyproject).
        run: uv run python -X warn_default_encoding -m pytest -q

      - name: Python lint
        working-directory: backend
        run: uvx ruff check mtgdm tests ../scripts

      - name: Frontend build and lint
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run lint

  package:
    name: Package (${{ matrix.name }})
    needs: [version, test]
    if: github.event_name != 'push' || needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    env:
      # Windows releases are signed through SignPath Foundation (free code signing for open source)
      # once its API token is a repository secret; pull requests and manual runs stay unsigned.
      SIGN_WINDOWS: ${{ matrix.name == 'windows-x64' && needs.version.outputs.release == 'true' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The minimal OpenCV build (scripts/build_opencv.py) takes minutes; reuse it while the
      # OpenCV version and the build script stay the same.
      - name: Cache minimal OpenCV
        uses: actions/cache@v4
        with:
          path: build/opencv-slim
          key: opencv-slim-${{ matrix.name }}-${{ hashFiles('backend/uv.lock', 'scripts/build_opencv.py') }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: scripts/build_macos.sh

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: uv run --no-project python scripts/smoke_test.py "dist/MTG Deck Manager.app/Contents/MacOS/mtgdm"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: uv run --no-project python scripts/smoke_test.py "dist/MTG Deck Manager/MTG Deck Manager.exe"

      # Only the exe is ours to sign: the bundled Python and library DLLs are upstream binaries.
      # The artifact configuration in SignPath is packaging/signpath/artifact-configuration.xml.
      - name: Upload the exe for signing
        id: unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-exe
          path: dist/MTG Deck Manager/MTG Deck Manager.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0 (gets the signing token: pinned)
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mtg-manager' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Each release is approved by hand in SignPath: the job waits up to an hour for it.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed
          parameters: |
            version: ${{ toJSON(needs.version.outputs.version) }}

      - name: Use the signed exe
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $exe = "dist\MTG Deck Manager\MTG Deck Manager.exe"
          Copy-Item "dist\signed\MTG Deck Manager.exe" $exe -Force
          Remove-Item -Recurse dist\signed
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne "Valid") { throw "Signature: $($signature.Status) $($signature.StatusMessage)" }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"
          ./scripts/build_windows.ps1 -ZipOnly

      - name: Smoke test (Windows, signed)
        if: env.SIGN_WINDOWS == 'true'
        run: uv run --no-project python scripts/smoke_test.py "dist/MTG Deck Manager/MTG Deck Manager.exe"

      # The package as it is (archive: false), named after its file: a zipped artifact would be a zip
      # holding the Windows zip.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.os == 'Windows' && 'dist/*.zip' || 'dist/*.dmg' }}
          archive: false
          if-no-files-found: error
          # Push builds are for checking; releases keep their files in GitHub Releases.
          retention-days: 14

  release:
    name: GitHub Release
    # After every package built and passed its smoke test (see the version job for when).
    needs: [version, package]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the commits since the previous release, for the notes

      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: MTG-Deck-Manager-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l release
          # Notes from the (squashed) commit messages since the previous release, not just PR titles.
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          python3 scripts/release_notes.py "$previous" "$TAG" "$GITHUB_REPOSITORY" > notes.md
          cat notes.md
          # On master the tag is created at this commit (a tag made with the workflow token does not
          # start another build).
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "MTG Deck Manager ${TAG#v}" \
            --notes-file notes.md
